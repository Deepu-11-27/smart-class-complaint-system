{% extends "base.html" %}

{% block title %}Page Not Found - Smart Class Complaint System{% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm p-5">
        <i class="bi bi-question-circle display-1 text-primary mb-3"></i>
        <h2 class="fw-bold">404 - Page Not Found</h2>
        <p class="text-muted">The page you were looking for does not exist or may have been moved.</p>
        <div class="d-flex justify-content-center gap-2 mt-3">
          <a href="{{ url_for('public.index') }}" class="btn btn-primary">
            <i class="bi bi-house me-1"></i> Return Home
          </a>
          <a href="{{ url_for('public.track') }}" class="btn btn-outline-secondary">
            <i class="bi bi-search me-1"></i> Track Complaint
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

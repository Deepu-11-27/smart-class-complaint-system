{% extends "base.html" %}

{% block title %}Server Error - Smart Class Complaint System{% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm p-5">
        <i class="bi bi-exclamation-octagon display-1 text-danger mb-3"></i>
        <h2 class="fw-bold">500 - Server Error</h2>
        <p class="text-muted">An unexpected error occurred. Our administration team has been notified.</p>
        <div class="mt-3">
          <a href="{{ url_for('public.index') }}" class="btn btn-primary">
            <i class="bi bi-house me-1"></i> Return Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
